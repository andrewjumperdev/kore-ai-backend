[project]
name = "kore-ai-backend"
version = "0.1.0"
description = "Kore AI — The Operating System for Growth. Multi-tenant AI agent platform."
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "python-multipart>=0.0.9",
    # Settings / validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    # Cache / queue state
    "redis>=5.0",
    # Async task queue
    "dramatiq[redis,watch]>=1.17",
    "apscheduler>=3.10",
    # Cifrado de credenciales de integraciones en reposo
    "cryptography>=42.0",
    # LLM
    "anthropic>=0.40",
    "openai>=1.40",
    # Integrations
    "httpx>=0.27",
    "stripe>=10.0",
    # Observability
    "structlog>=24.1",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Los defaults de ruff (E4/E7/E9 + F) más bugbear (B), que atrapa cosas con
# consecuencia real: excepciones sin encadenar, defaults mutables, asserts que
# no verifican nada. Se dejan fuera E501/I/UP a propósito: son estilo, y
# activarlos ahora reescribiría decenas de archivos ajenos a cualquier cambio
# en curso, volviendo ilegibles los diffs que importan.
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
