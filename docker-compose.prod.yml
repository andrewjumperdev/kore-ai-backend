# Producción: todo el stack en el VPS, detrás de un reverse proxy externo.
#   docker compose -f docker-compose.prod.yml up -d --build
#
# **Ningún servicio publica puertos al host.** Postgres, Redis, Evolution y el
# worker solo existen dentro de la red interna; el backend llega a Evolution por
# el nombre de servicio (http://evolution:8080). La única que se asoma es la API,
# y lo hace uniéndose a la red del proxy (`proxy`, más abajo) — no abriendo un
# puerto. Así no hay forma de alcanzar la base desde internet ni por error.
#
# El proxy lo pone otro stack (acá, Traefik vía EasyPanel) porque ya tenía
# tomados el 80 y el 443. Si en tu servidor no hay ninguno, volvé a agregar un
# servicio Caddy con esos puertos y el Caddyfile del repo.
#
# Las contraseñas salen del .env (ver .env.production.example). Antes estaban
# escritas acá: aunque la red sea interna, un secreto versionado en git es un
# secreto quemado, y rotarlo no debería requerir editar el compose.

x-backend: &backend
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: kore-backend:latest
  env_file: .env
  environment:
    KORE_POSTGRES_DSN: postgresql+asyncpg://kore:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}@db:5432/kore
    KORE_REDIS_URL: redis://redis:6379/0
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  # Corre las migraciones y termina. La API espera a que salga con éxito, así
  # nunca sirve tráfico contra un esquema viejo. Es un servicio aparte a
  # propósito: migrar desde el arranque de la API haría que los N workers de
  # gunicorn compitan por el mismo lock de Alembic.
  migrate:
    <<: *backend
    command: ["migrate"]
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *backend
    command: ["api"]
    # sin 'ports': el reverse proxy la alcanza por la red interna (api:8000)
    # Readiness real (Postgres + Redis), no un 200 estático: si la base se cae,
    # el contenedor se marca unhealthy en vez de seguir aceptando tráfico que
    # va a fallar. Solo en `api`: worker y scheduler no sirven HTTP.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # Dos redes: la interna del stack (Postgres, Redis, Evolution) y la del
    # reverse proxy. Solo la API se asoma a la red del proxy — la base y el
    # worker no tienen por qué ser alcanzables desde ahí.
    networks:
      - default
      - proxy

  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  scheduler:
    <<: *backend
    command: ["scheduler"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: kore
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kore"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Backup diario de Postgres, con retención de 14 días. Antes era un comando
  # sugerido en el README; un backup que depende de que alguien se acuerde no
  # es un backup.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?falta EVOLUTION_DB_PASSWORD en .env}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 3s
      retries: 10

  evolution:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    # sin 'ports': solo accesible desde la red interna (el backend la usa).
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?falta EVOLUTION_API_KEY en .env}
      SERVER_URL: http://evolution:8080
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_kore
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
    depends_on:
      evolution-db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - evolution_instances:/evolution/instances

# La red del reverse proxy ya existe y la administra otro stack (EasyPanel /
# Traefik). `external: true` significa "usala, no la crees ni la borres".
# En otro servidor, cambiá el nombre o quitá el bloque `networks` de `api` y
# volvé a poner un proxy propio.
networks:
  default:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-easypanel}

volumes:
  pgdata:
  redisdata:
  evolution_pgdata:
  evolution_instances:
